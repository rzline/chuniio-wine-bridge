[package]
name = "chuni-bridge-probe"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
memmap2 = "0.9"
ctrlc = { version = "3", features = ["termination"] }

[target.'cfg(target_os = "linux")'.dependencies]
hidapi = { version = "2.6", default-features = false, features = ["linux-shared-hidraw"] }
libc = "0.2"

[profile.release]
lto = true
codegen-units = 1
